name: Build Android

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-linux-android }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "src-tauri -> target" }

      - name: Cache Gradle (wrapper download + dependencies)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ github.run_id }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Check native libraries
        run: |
          test -f native-android/jniLibs/arm64-v8a/libpojavexec.so || { echo "::error::native-android/jniLibs/arm64-v8a/libpojavexec.so is missing in the repo (copy jniLibs from the full zip and push)"; exit 1; }
          test -d native-android/jre || { echo "::error::native-android/jre is missing in the repo"; exit 1; }

      - run: npm install
      - run: npm run typecheck
      - name: Rust tests (host, informational)
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
          cargo test --manifest-path src-tauri/Cargo.toml --lib
      - name: Generate Android project
        run: npx tauri android init --ci
      - name: Patch Android project
        run: node tools/android-setup.mjs
      - name: Build APK (debug + release, arm64)
        env:
          STAR_MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
        run: |
          export NDK_HOME="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"
          echo "NDK_HOME=$NDK_HOME"
          set -o pipefail
          # Gradle's download server sometimes answers 504: retry a failed build up to 3 times (a retry also reuses the Rust build).
          retry() { for i in 1 2 3; do "$@" && return 0; echo "::warning::build attempt $i failed, retrying in 30s"; sleep 30; done; return 1; }
          retry bash -c 'npx tauri android build --apk --target aarch64 --debug --ci 2>&1 | tee -a build.log'
          retry bash -c 'npx tauri android build --apk --target aarch64 --ci 2>&1 | tee -a build.log'
      - name: Show real build error
        if: failure()
        run: |
          grep -nE "^error|error\[|^e: |error:|What went wrong|Execution failed|FAILED|Caused by|cannot find symbol|TS[0-9]{4}" -A6 build.log | head -120 || true
      - name: Collect
        run: |
          D=$(find src-tauri/gen/android -name "*-debug.apk" | head -1); cp "$D" StarClient-debug.apk
          R=$(find src-tauri/gen/android -name "*-release*.apk" | head -1); cp "$R" StarClient-release.apk
          ls -la StarClient-*.apk
      - uses: actions/upload-artifact@v4
        with: { name: star-client-android, path: "StarClient-*.apk" }
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            StarClient-release.apk
            StarClient-debug.apk
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
