[package]
name = "star-client"
version = "0.1.0"
description = "Star Client Mobile - Minecraft Java Edition launcher for Android"
edition = "2021"
rust-version = "1.77"
license = "MIT"

[lib]
name = "star_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "process", "net", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
md-5 = "0.10"
regex = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
dirs = "5"
sysinfo = "0.32"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
chrono = { version = "0.4", features = ["serde"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
libc = "0.2"
xz2 = { version = "0.1", features = ["static"] }
tar = "0.4"

[dev-dependencies]
tempfile = "3"
mockito = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
